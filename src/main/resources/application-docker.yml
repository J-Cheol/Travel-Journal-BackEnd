spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:3306/${DB_NAME:traveljournal_db}?rewriteBatchedStatements=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY:test-access-key}
        secret-key: ${AWS_SECRET_KEY:test-secret-key}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${AWS_S3_BUCKET:test-bucket}

springdoc:
  request-url: ${APP_BASE_URL:http://localhost:8080}

custom:
  aws:
    upload-path: ${AWS_UPLOAD_PATH:source}
    resized-path: ${AWS_RESIZED_PATH:resized}
    default-profile-image: ${AWS_DEFAULT_PROFILE_IMAGE:default/profile/default1.png}

jwt:
  secret-key: ${JWT_SECRET_KEY:dGhpcy1pcy1hLWRvY2tlci1zYW1wbGUtc2VjcmV0LWtleQ==}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:1800000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800000}

oauth:
  kakao:
    client-id: ${KAKAO_CLIENT_ID:test}
    client-secret: ${KAKAO_CLIENT_SECRET:test}
    redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:3000/oauth/kakao/callback}
    token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
    user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
    admin-key: ${KAKAO_ADMIN_KEY:test}
  apple:
    team-id: ${APPLE_TEAM_ID:test}
    key-id: ${APPLE_KEY_ID:test}
    private-key-path: ${APPLE_PRIVATE_KEY_PATH:test}
    redirect-uri: ${APPLE_REDIRECT_URI:http://localhost:3000/oauth/apple/callback}
    services-id: ${APPLE_SERVICES_ID:test}
    ios-bundle-id: ${APPLE_IOS_BUNDLE_ID:test}
    android-bundle-id: ${APPLE_ANDROID_BUNDLE_ID:test}

oauth2:
  google:
    client-id: ${GOOGLE_CLIENT_ID:test}
    client-secret: ${GOOGLE_CLIENT_SECRET:test}
    scope: ${GOOGLE_SCOPE:openid,email,profile}
    redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/google/callback}
    token-uri: ${GOOGLE_TOKEN_URI:https://oauth2.googleapis.com/token}
    test-redirect-uri: ${GOOGLE_TEST_REDIRECT_URI:http://localhost:3000/auth/google/callback}